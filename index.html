<!DOCTYPE html>
<html lang="es" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard OTs CDMX y Centro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: sobrio, operativo, tablero de control nocturno
   IDEA: un instrumento de precisión: lecturas grandes y una escala horizontal de tiempo
   PICTURE: línea de tiempo de OTs por día + barras por plaza, filtrables
   COLOUR and TYPE: grafito #141517, aluminio #e9eaec, puntero naranja #3ee8ff; Geist
   LAYOUT: barra de carga y pestañas, lecturas, gráficas, tabla con búsqueda */
:root{color-scheme:dark;--bg:#141517;--panel:#1c1d20;--line:#2c2e33;--ink:#f4fbff;--mute:#9a9ca3;--acc:#3ee8ff;--acc2:#f4fbff}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Geist,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3vw,40px) max(4vw,16px);max-width:1240px;margin:0 auto}
header.band{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between;padding-bottom:8px}
h1{text-shadow:0 0 14px rgba(244,251,255,.35);font-size:clamp(28px,4vw,42px);line-height:1.05;margin:0;font-weight:700;text-wrap:balance}
.tag{margin:6px 0 0;font:600 clamp(15px,1.6vw,18px) Geist,sans-serif;letter-spacing:.04em;color:var(--acc);text-shadow:0 0 10px rgba(62,232,255,.55)}
.sub{color:var(--mute);margin:6px 0 0;font-size:15px}
.load{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.drop{border:1px dashed #44474e;border-radius:10px;padding:10px 16px;color:var(--mute);font-size:14px;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px}
.drop.on{border-color:var(--acc);color:var(--ink)}
.drop b{color:var(--acc);font-weight:600}
input[type=file]{display:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tab{background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:0 18px;min-height:44px;font:500 15px Geist,sans-serif;cursor:pointer}
.tab[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#001a20;box-shadow:0 0 14px rgba(62,232,255,.6)}
.tab:focus-visible,.drop:focus-visible,input:focus-visible,th button:focus-visible,.bar:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--panel);padding:18px 20px}
.kpi span{display:block;color:var(--mute);font-size:13px}
.kpi strong{display:block;color:var(--acc2);text-shadow:0 0 12px rgba(244,251,255,.55),0 0 2px #fff;font-size:clamp(28px,3.6vw,44px);font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.card h2{font-size:17px;margin:0 0 4px;font-weight:600}
.card p.h{margin:0 0 12px;color:var(--mute);font-size:13px}
.fig{position:relative;min-height:240px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 2.5em;gap:10px;align-items:center;background:none;border:0;color:var(--ink);font:14px Geist,sans-serif;text-align:left;padding:4px;border-radius:6px;cursor:pointer;min-height:36px}
.bar:hover{background:#25272b}.bar.sel{background:#0b2a33}
.bar i{display:block;height:14px;border-radius:3px;background:var(--acc);box-shadow:0 0 10px rgba(62,232,255,.65);transition:width .4s}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.tools input{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:0 12px;min-height:44px;font:16px Geist,sans-serif;width:min(340px,100%)}
.chip{font-size:13px;color:var(--acc2);background:#0b2a33;border-radius:999px;padding:4px 12px;cursor:pointer;border:0;min-height:32px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;box-shadow:0 0 18px rgba(62,232,255,.08)}
.filters label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.filters select{background:var(--bg);color:var(--ink);border:1px solid var(--acc);border-radius:8px;min-height:44px;padding:0 36px 0 12px;font:16px Geist,sans-serif;min-width:150px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--acc) 50%),linear-gradient(135deg,var(--acc) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;box-shadow:0 0 8px rgba(62,232,255,.25)}
.filters select:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.filters .chip{min-height:44px;padding:0 16px}
.fsum{color:var(--mute);font-size:14px;align-self:center}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:500;border-bottom:1px solid var(--line);padding:0}
th button{background:none;border:0;color:inherit;font:inherit;padding:10px 8px;cursor:pointer;width:100%;text-align:left}
td{padding:10px 8px;border-bottom:1px solid #232529;vertical-align:top}
td.ot{font-family:'Geist Mono',monospace;color:var(--acc);text-shadow:0 0 8px rgba(62,232,255,.5);white-space:nowrap}
td.f{white-space:nowrap;font-variant-numeric:tabular-nums}
td.as{color:var(--mute);font-size:13px;max-width:380px}
.warn{color:#ffcf6b}
.empty{color:var(--mute);padding:24px 8px;text-align:center}
.note{color:var(--mute);font-size:13px;margin-top:10px}
.err{color:#ff8a80;font-size:14px}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7em;text-align:start;max-width:none}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;color:var(--mute)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body>
<header class="band">
  <div><h1 id="title">DETONACIONES RECIBIDAS</h1><p class="tag">IMP_CONECTIVIDAD_CDMX</p><p class="sub" id="sub">Cargando…</p>
  <div class="tabs" role="tablist" id="tabs"></div></div>
  <div class="load">
    <label class="drop" id="drop" tabindex="0"><input type="file" id="file" accept=".xlsx,.xls,.xlsm,.csv">Arrastra o <b>elige un Excel</b> de correos</label>
  </div>
</header>
<main class="band" style="padding-top:12px">
  <div class="filters" id="filters">
    <label>Año<select id="fy"></select></label>
    <label>Mes<select id="fm"></select></label>
    <button class="chip" id="freset" type="button">Ver todo</button>
    <span class="fsum" id="fsum"></span>
  </div>
  <p class="err" id="err" hidden></p>
  <section class="kpis" id="kpis"></section>
  <div class="grid">
    <section class="card"><h2>OTs por día</h2><p class="h">Correos recibidos en el periodo, por fecha</p><div class="fig" id="fig"><svg id="svg" role="img" aria-label="OTs por día"><defs><filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg></div></section>
    <section class="card"><h2>OTs por sucursal</h2><p class="h">Toca una sucursal para filtrar la tabla</p><div class="bars" id="bars"></div></section>
  </div>
  <section class="card" style="margin-top:16px">
    <div class="tools"><h2 style="margin:0">Detalle de órdenes</h2><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span id="chip"></span><input id="q" type="search" placeholder="Buscar cliente, OT, sucursal, ID MCA…" aria-label="Buscar"></div></div>
    <div class="scroll"><table class="stack"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
    <p class="note" id="note"></p>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
<script>
{
const SHEETS=['CDMX','CENTRO'];
const SEED={"CDMX": [{"n": 1, "fecha": "2026-11-17T15:00:59", "rem": "mjpalaciosr@mcmtechco.com", "asunto": "RV: OT-425313 || GOLD TELECOM, INC || FAC-GCN-J0G-310726-DMH", "cliente": "GOLD TELECOM, INC", "id": "997-0", "plaza": "xMCM", "ot": "OT-425313"}], "CENTRO": [{"n": 1, "fecha": "2026-11-19T16:33:58", "rem": "jorge.moreno@mcmtechco.com", "asunto": "RV: OT-437398 Cemex Operaciones Mexico SA de CV // CLIENTE Directo", "cliente": "Cemex Operaciones Mexico SA de CV", "id": "106-853764-2", "plaza": "Toluca", "ot": "OT-437398"}, {"n": 2, "fecha": "2026-11-17T18:35:10", "rem": "jorge.moreno@mcmtechco.com", "asunto": "RV: OT-434834 GRUPO POSADAS S.A.B. DE C.V. (Fiesta Americana Hacienda   Ixtapan de la Sal) // CLIENTE Directo", "cliente": "GRUPO POSADAS S.A.B. DE C.V. (Fiesta Americana Hacienda Ixtapan de la Sal)", "id": "302-6183-2", "plaza": "Ixtapan de la Sal", "ot": "OT-434834"}, {"n": 3, "fecha": "2026-11-11T17:44:35", "rem": "jorge.moreno@mcmtechco.com", "asunto": "RV: OT-431559 INSTITUTO DE INFERTILIDAD Y GENETICA MEXICO S. C. //   CLIENTE Directo", "cliente": "INSTITUTO DE INFERTILIDAD Y GENETICA MEXICO S. C.", "id": "107-440795-2", "plaza": "Metepec", "ot": "OT-431559"}, {"n": 4, "fecha": "2026-11-10T19:07:49", "rem": "jorge.moreno@mcmtechco.com", "asunto": "RV: OT-435067 Corporativo Contable CYG // CLIENTE Directo", "cliente": "Corporativo Contable CYG", "id": "106-853101-3", "plaza": "Toluca", "ot": "OT-435067"}, {"n": 5, "fecha": "2026-11-06T16:39:11", "rem": "jorge.moreno@mcmtechco.com", "asunto": "RV: OT-433620 Nueva Elektra del Milenio, S.A. de C.V.   (234506_OCC_IXTLAHUACA) // CLIENTE Directo", "cliente": "FACTIBILIDAD NOMBRE Latest Site ID Latest Latitude Latest Longitude Red de Fo de conexion Hotel ID Fat/Cierre", "id": "152-12498-2", "plaza": "Ixtlahuaca", "ot": "OT-433620"}, {"n": 6, "fecha": "2026-11-05T22:42:06", "rem": "jorge.moreno@mcmtechco.com", "asunto": "RV: OT-429739 Ragar // CLIENTE Directo", "cliente": "Ragar", "id": "232-11926-3", "plaza": "Santa María Rayón", "ot": "OT-429739"}]};
let fy='',fm='',data={},fileName='correos_20261123_1526.xlsx',view='TODAS',plaza=null,q='',sortK='fecha',sortD=-1;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtD=d=>d?`${d.getDate()} ${MES[d.getMonth()]} ${d.getFullYear()}`:'—';
const fmtDT=d=>d?`${fmtD(d)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`:'—';
const dayKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const suspicious=c=>!c||/FACTIBILIDAD|Latitude|Longitude|Site ID/i.test(c);
function cleanClient(r){if(!suspicious(r.cliente))return r.cliente;const m=String(r.asunto||'').match(/OT-\d+\s*(?:\|\|)?\s*(.+?)\s*(?:\/\/|\|\||$)/);return m?m[1].replace(/\s+/g,' ').trim():(r.cliente||'');}
function norm(rows,sheet){return rows.filter(r=>r.asunto||r.ot).map(r=>{const d=r.fecha instanceof Date?r.fecha:(r.fecha?new Date(r.fecha):null);const x={sheet,fecha:d&&!isNaN(d)?d:null,rem:r.rem||'',asunto:r.asunto||'',cliente:r.cliente||'',id:r.id||'',plaza:(r.plaza||'Sin sucursal').toString().trim(),ot:r.ot||''};x.fixed=suspicious(x.cliente);x.cli=cleanClient(x);return x;});}
function loadSeed(){for(const s of SHEETS)data[s]=norm(SEED[s]||[],s);}
function pick(o,names){const k=Object.keys(o).find(k=>names.includes(k.trim().toLowerCase()));return k?o[k]:'';}
function readFile(f){
  $('err').hidden=true;
  if(typeof XLSX==='undefined'){showErr('No se pudo cargar el lector de Excel (sin conexión a cdnjs).');return;}
  const rd=new FileReader();
  rd.onload=e=>{try{
    const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
    const found={};
    for(const s of SHEETS){const name=wb.SheetNames.find(n=>n.trim().toUpperCase()===s);if(!name)continue;
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:''});
      found[s]=norm(rows.map(o=>({fecha:pick(o,['fecha']),rem:pick(o,['remitente original','remitente']),asunto:pick(o,['asunto']),cliente:pick(o,['cliente']),id:pick(o,['id mca','id']),plaza:pick(o,['plaza','sucursal']),ot:pick(o,['ot'])})),s);}
    if(!Object.keys(found).length){showErr('El archivo no tiene pestañas llamadas CDMX ni CENTRO.');return;}
    data={CDMX:found.CDMX||[],CENTRO:found.CENTRO||[]};fileName=f.name;plaza=null;render();
  }catch(err){showErr('No se pudo leer el archivo: '+err.message);}};
  rd.readAsArrayBuffer(f);
}
function showErr(m){$('err').textContent=m;$('err').hidden=false;}
const MESL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function inPeriod(r){if(!fy&&!fm)return true;if(!r.fecha)return false;return (!fy||r.fecha.getFullYear()==fy)&&(!fm||r.fecha.getMonth()+1==fm);}
function rowsFor(){return (view==='TODAS'?[...data.CDMX,...data.CENTRO]:data[view]).filter(inPeriod);}
function renderFilters(){
  const all=[...data.CDMX,...data.CENTRO].filter(r=>r.fecha);
  const ys=[...new Set(all.map(r=>r.fecha.getFullYear()))].sort((a,b)=>b-a);
  if(fy&&!ys.includes(+fy))fy='';
  const ms=[...new Set(all.filter(r=>!fy||r.fecha.getFullYear()==fy).map(r=>r.fecha.getMonth()+1))].sort((a,b)=>a-b);
  if(fm&&!ms.includes(+fm))fm='';
  $('fy').innerHTML='<option value="">Todos</option>'+ys.map(y=>`<option value="${y}"${y==fy?' selected':''}>${y}</option>`).join('');
  $('fm').innerHTML='<option value="">Todos</option>'+ms.map(m=>`<option value="${m}"${m==fm?' selected':''}>${MESL[m-1]}</option>`).join('');
  $('fsum').textContent=(fy||fm)?`Periodo: ${fm?MESL[fm-1]+' ':''}${fy||'(todos los años)'}`:'Periodo: todo el archivo';
}
function renderTabs(){const c=k=>data[k].filter(inPeriod).length;const t=[['TODAS','Ambas',c('CDMX')+c('CENTRO')],['CDMX','CDMX',c('CDMX')],['CENTRO','Centro',c('CENTRO')]];
  $('tabs').innerHTML=t.map(([k,l,n])=>`<button class="tab" role="tab" aria-selected="${k===view}" data-k="${k}">${l} · ${n}</button>`).join('');}
function renderKpis(rows){
  const cl=new Set(rows.map(r=>r.cli.toLowerCase())).size,pl=new Set(rows.map(r=>r.plaza)).size;
  const ds=rows.map(r=>r.fecha).filter(Boolean).sort((a,b)=>a-b);const last=ds[ds.length-1],first=ds[0];
  const rem=new Set(rows.map(r=>r.rem)).size;
  $('kpis').innerHTML=[['Detonaciones',rows.length,`${rem} remitente${rem===1?'':'s'}`],['Clientes únicos',cl,'por nombre de cliente'],['Sucursales',pl,view==='TODAS'?'en ambas pestañas':'en '+(view==='CDMX'?'CDMX':'Centro')],['Último correo',last?fmtD(last):'—',first?`desde ${fmtD(first)}`:'']]
   .map(([a,b,c])=>`<div class="kpi"><span>${a}</span><strong>${esc(b)}</strong><small>${esc(c)}</small></div>`).join('');}
function renderBars(rows){

function drawChart(){
  const s=$('svg'),W=s.clientWidth,H=s.clientHeight;if(!W)return;const rows=rowsFor();
  const ds=rows.map(r=>r.fecha).filter(Boolean);if(!ds.length){s.innerHTML=`<text x="${W/2}" y="${H/2}" fill="#9a9ca3" text-anchor="middle" font-size="14">Sin fechas</text>`;return;}
  const t0=new Date(Math.min(...ds));t0.setHours(0,0,0,0);const t1=new Date(Math.max(...ds));t1.setHours(0,0,0,0);
  const days=[];for(let d=new Date(t0);d<=t1;d.setDate(d.getDate()+1))days.push(new Date(d));
  if(days.length<7){const p=new Date(days[0]);while(days.length<7){p.setDate(p.getDate()-1);days.unshift(new Date(p));}}
  const cnt={};const per={CDMX:{},CENTRO:{}};rows.forEach(r=>{if(!r.fecha)return;const k=dayKey(r.fecha);cnt[k]=(cnt[k]||0)+1;per[r.sheet][k]=(per[r.sheet][k]||0)+1;});
  const mx=Math.max(1,...Object.values(cnt));const L=28,R=8,T=12,B=30,iw=W-L-R,ih=H-T-B,bw=iw/days.length;

  days.forEach((d,i)=>{const k=dayKey(d),x=L+i*bw,w=Math.max(2,bw-Math.min(6,bw*.25));const a=per.CENTRO[k]||0,b=per.CDMX[k]||0;
    if(a)g+=`<rect x="${x+(bw-w)/2}" y="${y(a)}" width="${w}" height="${ih-(y(a)-T)}" fill="#3ee8ff" rx="2"><title>${fmtD(d)} · Centro: ${a}</title></rect>`;
    if(b)g+=`<rect x="${x+(bw-w)/2}" y="${y(a+b)}" width="${w}" height="${y(a)-y(a+b)}" fill="#f4fbff" rx="2"><title>${fmtD(d)} · CDMX: ${b}</title></rect>`;
    if(i%step===0)g+=`<text x="${x+bw/2}" y="${H-10}" fill="#9a9ca3" font-size="12" text-anchor="middle">${d.getDate()} ${MES[d.getMonth()]}</text>`;});
  if(view==='TODAS')g+=`<g font-size="12" fill="#f4fbff"><rect x="${W-R-150}" y="${T}" width="10" height="10" fill="#3ee8ff"/><text x="${W-R-135}" y="${T+9}">Centro</text><rect x="${W-R-75}" y="${T}" width="10" height="10" fill="#f4fbff"/><text x="${W-R-60}" y="${T+9}">CDMX</text></g>`;
  s.innerHTML='<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g>'+g.replace(/<rect /g,'<rect filter="url(#glow)" ')+'</g>';}
const COLS=[['ot','OT'],['fecha','Fecha'],['cli','Cliente'],['plaza','Sucursal'],['id','ID MCA'],['sheet','Pestaña'],['rem','Remitente'],['asunto','Asunto']];
function renderTable(rows){
  $('thead').innerHTML=COLS.map(([k,l])=>`<th><button data-s="${k}">${l}${sortK===k?(sortD>0?' ↑':' ↓'):''}</button></th>`).join('');
  const qq=q.toLowerCase();let r=rows.filter(x=>(!plaza||x.plaza===plaza)&&(!qq||[x.ot,x.cli,x.cliente,x.plaza,x.id,x.rem,x.asunto].join(' ').toLowerCase().includes(qq)));
  r.sort((a,b)=>{const A=a[sortK],B=b[sortK];return (A>B?1:A<B?-1:0)*sortD;});
  $('tbody').innerHTML=r.length?r.map(x=>`<tr><td class="ot">${esc(x.ot)}</td><td class="f">${fmtDT(x.fecha)}</td><td>${esc(x.cli)}${x.fixed?' <span class="warn" title="El campo Cliente del Excel no era un nombre válido; se tomó del asunto">*</span>':''}</td><td>${esc(x.plaza)}</td><td class="f">${esc(x.id)}</td><td>${x.sheet==='CDMX'?'CDMX':'Centro'}</td><td>${esc(x.rem)}</td><td class="as">${esc(x.asunto)}</td></tr>`).join(''):`<tr><td colspan="8" class="empty">No hay órdenes con ese filtro</td></tr>`;
  $('chip').innerHTML=plaza?`<button class="chip" id="clr">Sucursal: ${esc(plaza)} ✕</button>`:'';
  const fx=rows.some(x=>x.fixed);$('note').innerHTML=`Mostrando ${r.length} de ${rows.length}.`+(fx?' <span class="warn">*</span> Cliente tomado del asunto porque la celda del Excel traía texto ajeno.':'');}
function render(){renderFilters();const rows=rowsFor();$('sub').textContent=`Archivo: ${fileName} · pestañas CDMX y CENTRO`;renderTabs();renderKpis(rows);renderBars(rows);drawChart();renderTable(rows);
  try{localStorage.setItem('ot-tab',view)}catch(e){}}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;view=b.dataset.k;plaza=null;render();});
$('bars').addEventListener('click',e=>{const b=e.target.closest('.bar');if(!b)return;plaza=plaza===b.dataset.p?null:b.dataset.p;renderBars(rowsFor());renderTable(rowsFor());});
$('chip').addEventListener('click',e=>{if(e.target.closest('#clr')){plaza=null;renderBars(rowsFor());renderTable(rowsFor());}});
$('thead').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.s;sortD=sortK===k?-sortD:1;sortK=k;renderTable(rowsFor());});
$('fy').addEventListener('change',e=>{fy=e.target.value;plaza=null;render();});
$('fm').addEventListener('change',e=>{fm=e.target.value;plaza=null;render();});
$('freset').addEventListener('click',()=>{fy='';fm='';plaza=null;render();});
$('q').addEventListener('input',e=>{q=e.target.value;renderTable(rowsFor());});
$('file').addEventListener('change',e=>{if(e.target.files[0])readFile(e.target.files[0]);});
const dz=$('drop');dz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click();}});
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();dz.classList.add('on');}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('on');}));
document.addEventListener('drop',e=>{const f=e.dataTransfer?.files?.[0];if(f)readFile(f);});
const ro=new ResizeObserver(drawChart);ro.observe($('svg'));
try{const v=localStorage.getItem('ot-tab');if(['TODAS','CDMX','CENTRO'].includes(v))view=v;}catch(e){}
loadSeed();render();
}
</script>
</body></html>
